# ============================================================
# LifePvEAssist 温度管理モジュール 設定ファイル
# 配置先: plugins/LifePvEAssist/temp/config.yml
# ============================================================

# 温度管理システムを有効化するワールド名（完全一致・大文字小文字区別なし）
enabled-worlds:
  - world_ura_jokyu

# 温度の基本設定
temperature:
  # デフォルト温度 (℃)
  default: 20.0
  # 基本の高温側即死ライン (℃)
  base-max-limit: 100.0
  # 基本の低温側即死ライン (℃)
  base-min-limit: -80.0
  # 自然回復の設定
  recovery:
    # 最後に温度変更を受けてから自然回復が始まるまでの待機時間 (秒)
    delay-seconds: 10
    # 待機時間経過後、1秒ごとにデフォルト温度へ戻る量 (℃/秒)
    rate-per-second: 20.0
    # 空間エリア(zone)からの温度変化でも自然回復カウントをリセットするか
    reset-timer-on-zone-change: true

# 死亡・ゲームモード等の扱い
lifecycle:
  # 死亡時にデフォルト温度へリセットするか
  reset-on-death: true
  # クリエイティブ・スペクテイターモード時はデメリットや即死を無効化するか
  ignore-creative-spectator: true
  # プレイヤーデータ保存先ファイル (plugins/LifePvEAssist/temp/playerdata.yml)
  # ※PDC(プレイヤー本体)と併用してリログイン時も確実に維持します
  save-interval-seconds: 300

# 専用防具（耐熱・耐冷）の設定
armor:
  # NBTタグで明示的な延長値がなく「種類のみ」または部位カウントを使う場合の1部位あたり基本延長値 (℃)
  default-limit-bonus-per-piece: 50.0
  # デメリット段階の無効化に必要な部位数
  # 2部位: 第1段階(鈍足・盲目)無効化 / 4部位: 第2段階(継続ダメージのみ)無効化(視界エフェクトは維持)
  stage1-immunity-pieces: 2
  stage2-damage-immunity-pieces: 4
  # MythicMobs の NBT: セクションで認識するタグキー名
  # 例:
  #   NBT:
  #     lifetemp_heat: 50
  #     lifetemp_cold: 50
  nbt-keys:
    heat: "lifetemp_heat"
    cold: "lifetemp_cold"
  # 任意: NBTタグを付けられないアイテム向けに MythicMobs アイテムID で直接指定するフォールバック
  # 形式:
  #   MythicItemId:
  #     type: HEAT # HEAT / COLD / BOTH
  #     bonus: 50.0
  #     pieces: 1
  mythic-item-overrides: {}

# デメリット設定（各プレイヤーの現在の即死ラインからの逆算）
penalties:
  # 第1段階: 鈍足・盲目（2部位で無効化）
  stage1:
    # 即死ラインの何℃手前から発動するか
    offset-from-lethal: 40.0
    slowness:
      enabled: true
      amplifier: 1 # 0 = 鈍足I, 1 = 鈍足II
    blindness:
      enabled: true
      amplifier: 0 # 0 = 盲目I
    effect-duration-ticks: 60

  # 第2段階: 継続ダメージ＋視界エフェクト（4部位でダメージのみ無効化・視界エフェクトは維持）
  stage2:
    # 即死ラインの何℃手前から発動するか
    offset-from-lethal: 20.0
    damage:
      enabled: true
      amount: 2.0
      interval-seconds: 1
      bypass-armor: false
    visual-effects:
      heat-fire-overlay: true
      cold-freeze-overlay: true
      cold-freeze-ticks: 140

  # 第3段階: 即死（防具で無効化不可）
  lethal:
    heat-death-message: "<red><bold>灼熱の高温に耐えられず力尽きた... (<temp>℃)"
    cold-death-message: "<aqua><bold>極寒の低温に耐えられず凍え死んだ... (<temp>℃)"

# 警告 Title 設定
warning:
  enabled: true
  offset-from-lethal: 20.0
  interval-seconds: 5
  fade-in-ticks: 5
  stay-ticks: 30
  fade-out-ticks: 10
  heat:
    title: "<red><bold>⚠ 高温警告 ⚠"
    subtitle: "<gold>現在 <temp>℃ <gray>(即死ライン: <max>℃)"
    sound: "minecraft:block.note_block.pling"
    sound-volume: 1.0
    sound-pitch: 0.6
  cold:
    title: "<aqua><bold>⚠ 低温警告 ⚠"
    subtitle: "<white>現在 <temp>℃ <gray>(即死ライン: <min>℃)"
    sound: "minecraft:block.note_block.pling"
    sound-volume: 1.0
    sound-pitch: 0.5

# BossBar によるリアルタイム温度表示（1秒=20tickごとに更新）
bossbar:
  enabled: true
  hide-when-normal: false
  overlay: "NOTCHED_10"
  title-format: "<status> <white>温度: <temp_color><temp>℃ <gray>[<aqua><min>℃ <gray>～ <red><max>℃<gray>]"
  status-labels:
    normal: "<green>[安定]"
    hot-stage1: "<yellow>[高温注意]"
    hot-stage2: "<red><bold>[高温危険]"
    cold-stage1: "<aqua>[低温注意]"
    cold-stage2: "<blue><bold>[低温危険]"

# 空間での継続温度変化エリア（WorldEdit風範囲指定）の設定
zones:
  wand-material: "BLAZE_ROD"
  wand-name: "<gold><bold>温度エリア選択ワンド"
  preview-duration-seconds: 10
