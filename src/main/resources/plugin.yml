name: LifePvEAssist
version: '${version}'
main: net.azisaba.lifepveassist.LifePvEAssist
api-version: '1.21.11'
author: Azisaba Network
depend: [ MythicMobs ]
softdepend: [ Vault, WorldEdit, FastAsyncWorldEdit, LifePvELevel ]

commands:
  lifepveassist:
    description: LifePvEAssist main command (LifeCraft / temp)
    aliases: [ lpa ]
    usage: /<command> [temp <info|set|add|reset|armor|zone|bypass|reload>]
  blocking:
    description: Toggle repair/salvage blocking

permissions:
  lifepveassist.command.lifecraft:
    description: Allows opening the LifeCraft menu via /lifepveassist
    default: op
  lifepveassist.temp.use:
    description: Allows checking own temperature info via /lifepveassist temp info
    default: true
  lifepveassist.temp.admin:
    description: Allows using all temperature admin subcommands
    default: op
    children:
      lifepveassist.temp.use: true
  lifepveassist.temp.bypass:
    description: Allows toggling personal temperature bypass mode via /lifepveassist temp bypass
    default: op
