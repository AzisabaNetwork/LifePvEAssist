name: LifePvEAssist
version: '${version}'
main: net.azisaba.lifepveassist.LifePvEAssist
api-version: '1.21.11'
author: Azisaba Network
depend: [ MythicMobs ]
softdepend: [ Vault ]

commands:
  lifepveassist:
    description: LifePvEAssist main command
    permission: lifepveassist.command.lifecraft
  blocking:
    description: Toggle repair/salvage blocking

permissions:
  lifepveassist.command.lifecraft:
    description: Allows using the /lifepveassist command
    default: op
